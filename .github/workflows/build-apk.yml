name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📜 Install Android SDK Platform 36 & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: 📝 Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🌐 Build Web App
        run: npx vite build

      - name: 🔄 Copy Web Assets to Android
        run: npx cap copy android

      - name: 🔨 Build Standalone Android APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: 📝 Post Build Log on Failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "### Gradle Build Log (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Jantri-Release-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 🚀 Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v4.0.2
          name: Aman Jantri v4.0.2 (Demo User 1-Week Expiry & Hardware Device Lock)
          body: "Direct Download APK for Aman Jantri (Android) - Featuring: 1) Hardware device lock: account binds strictly to the first physical device logged in and cannot be opened on any other device, 2) Configured 7-day demo account (9988776655 / 123) with strict automatic expiry, 3) Share as JPG image and text options, 4) Complete Jantri distribution controls."
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/**/*.apk
