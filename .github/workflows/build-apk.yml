name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📜 Install Android SDK Platform 36 & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: 📝 Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🌐 Build Web App
        run: npx vite build

      - name: 🔄 Copy Web Assets to Android
        run: npx cap copy android

      - name: 🔨 Build Standalone Android APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: 📝 Post Build Log on Failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "### Gradle Build Log (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Jantri-Release-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 🚀 Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v3.9.3
          name: Aman Jantri v3.9.3 (15-20 Full 100s, Realistic ±100-200 Balance, Exact Grand Total)
          body: "Direct Download APK for Aman Jantri (Android) - Featuring: 1) 15-20 houses of 100 in First Parchi, and 15-20 houses of 100 in Second Parchi, 2) 100 houses in one parchi are 0 (blank) in the other, 3) Remaining houses split (80/20, 60/40, 70/30, 90/10, 50/50), 4) Natural realistic ±100-200 difference between parchis (e.g. 5010+4990, 4850+5150) preserving exact Grand Total (10,000), 5) Zero house budget violations (never > 100)."
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/**/*.apk
